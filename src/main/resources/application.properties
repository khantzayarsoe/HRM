spring.application.name=HumanResourceManagement

# Server configuration
server.port=8080
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-binding-errors=always

# Tomcat specific configuration - CRITICAL FIX
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.basedir=${java.io.tmpdir}/tomcat

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3307/hrm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
# create update
spring.jpa.show-sql=true


spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

#Spring Multipart configuration - CRITICAL FIX

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}/spring_uploads
spring.servlet.multipart.resolve-lazily=true

file.upload-dir=uploads




